<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<title>المختار للصيرفة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الصيرفة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
/* ═══════════ دفتر رسمي حديث — هوية المختار للصيرفة ═══════════
   ورق دفتر + ختم أخضر + نحاسي. اللون = معنى فقط:
   أزرق = دخول (لكم)، أحمر = خروج (لنا)، عنبري = معلّق، أخضر = متزامن/ربح */
:root{
  --paper:#F5F2E9; --paper2:#ECE8DA; --card:#FBFAF4;
  --line:#DAD4C0; --line2:#C8C0A6;
  --ink:#182720; --ink2:#5A6457; --ink3:#8B927F;
  --seal:#0E3B2E; --seal2:#12503C; --sealT:rgba(14,59,46,.07);
  --brass:#A8862F; --brassT:rgba(168,134,47,.12);
  --in:#1D5FA8; --inT:rgba(29,95,168,.09);
  --out:#B3372F; --outT:rgba(179,55,47,.09);
  --pend:#9A6B15; --pendT:rgba(176,124,36,.13);
  --ok:#0B7A4B; --okT:rgba(11,122,75,.12);
  --r:14px; --r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;min-height:100dvh}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r2);padding:.6rem .8rem;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--seal)}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px}
label{font-size:.78rem;font-weight:700;color:var(--ink2);display:block;margin-bottom:.25rem}
::placeholder{color:var(--ink3)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ─── شاشة الدخول ─── */
#loginView{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:linear-gradient(180deg,var(--seal) 0 46%,var(--paper) 46%)}
.loginCard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:2.2rem 1.8rem;width:100%;max-width:400px;box-shadow:0 24px 60px -24px rgba(14,39,32,.45)}
.loginSeal{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:1.6rem;text-align:center}
.loginSeal h1{font-size:1.45rem;font-weight:900;color:var(--seal);line-height:1.3}
.loginSeal p{font-size:.82rem;color:var(--ink2)}
.btnMain{display:block;width:100%;background:var(--seal);color:#F3EFE2;font-weight:800;font-size:1.02rem;padding:.8rem;border-radius:var(--r2);transition:background .15s}
.btnMain:hover{background:var(--seal2)}
.btnMain:disabled{opacity:.55;cursor:wait}
.loginErr{background:var(--outT);color:var(--out);border-radius:var(--r2);padding:.55rem .8rem;font-size:.82rem;font-weight:700;margin-top:.8rem;display:none}

/* ─── هيكل التطبيق ─── */
#appView{display:none;min-height:100dvh}
.topbar{background:var(--seal);color:#EFEBDD;position:sticky;top:0;z-index:40;
  border-bottom:3px solid var(--brass)}
.tbRow{display:flex;align-items:center;gap:.8rem;padding:.55rem .9rem;max-width:1280px;margin:0 auto}
.tbBrand{display:flex;align-items:center;gap:.55rem;flex-shrink:0}
.tbBrand b{font-size:1.02rem;font-weight:900;white-space:nowrap}
.tbBrand small{display:block;font-size:.62rem;color:#C8C2A8;font-weight:600;line-height:1}
.tbName{flex:1;text-align:center;font-weight:900;font-size:1.2rem;color:#F7F3E4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .4rem}
.tbName small{font-size:.68rem;font-weight:600;color:#B9C7B4;display:block;line-height:1.1}
#clockChip{flex-shrink:0;display:inline-flex;align-items:center;gap:.25rem;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.28rem .6rem;font-size:.74rem;font-weight:900;color:#F0EBD8;font-variant-numeric:tabular-nums;white-space:nowrap;margin-inline-end:.35rem}
#syncJewel{flex-shrink:0;display:flex;align-items:center;gap:.4rem;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.28rem .7rem;font-size:.72rem;font-weight:800;color:#D8D2B8;white-space:nowrap}
#syncJewel .dot{width:9px;height:9px;border-radius:50%;background:#8a927f;flex-shrink:0}
#syncJewel.live .dot{background:#3DDC84;box-shadow:0 0 7px #3DDC84}
#syncJewel.live{color:#BFF2D5}
#syncJewel.busy .dot{background:#E8B84B;animation:pulse 1s infinite}
#syncJewel.busy{color:#F4DFA5}
#syncJewel.off .dot{background:#9aa39a}
#syncJewel.stale .dot{background:#E8B84B}
#syncJewel.stale{color:#F4DFA5}
@keyframes pulse{50%{opacity:.35}}
.tbTabs{display:flex;gap:.15rem;padding:0 .9rem .0rem;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tbTabs::-webkit-scrollbar{display:none}
.tabb{color:#B7C2AE;font-weight:700;font-size:.86rem;padding:.5rem .85rem;border-radius:10px 10px 0 0;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px}
.tabb.on{color:#fff;border-bottom-color:var(--brass);background:rgba(255,255,255,.06)}
#updateBanner{display:none;background:var(--brass);color:#fff;text-align:center;padding:.5rem;font-weight:800;font-size:.85rem;cursor:pointer}

/* ─── التخطيط ─── */
.shell{display:flex;gap:1.1rem;max-width:1280px;margin:0 auto;padding:1.1rem .9rem 5.5rem;align-items:flex-start}
.side{width:290px;flex-shrink:0;position:sticky;top:104px;display:flex;flex-direction:column;gap:.6rem;max-height:calc(100dvh - 130px)}
.sideList{overflow-y:auto;display:flex;flex-direction:column;gap:.65rem;padding:.15rem .15rem .6rem}
.main{flex:1;min-width:0}
@media(max-width:900px){.side{display:none}.shell{padding-bottom:6.2rem}}

/* عنصر عميل بالقائمة الجانبية */
/* صف الزبون بالقائمة الجانبية — أفاتار بلونو، اسم + سطر حالة، والرصيد بالطرف مع وسم لكم/لنا، وشريط لون رفيع */
.sClient{position:relative;display:flex;align-items:center;gap:.7rem;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:.85rem .7rem .85rem 1rem;min-height:3.6rem;text-align:right;width:100%;overflow:hidden;transition:border-color .12s,box-shadow .12s,transform .12s,background .12s}
.sClient::after{content:'';position:absolute;inset-inline-end:0;top:0;bottom:0;width:4px;background:var(--cc,var(--seal));opacity:.9}
.sClient:hover{border-color:var(--line2);transform:translateX(-2px)}
/* 🟢 المختار — لون ظاهر: أخضر الختم وخط أبيض، شريطو الملوّن أعرض، وسهم صغير */
.sClient.on{background:var(--seal);border-color:var(--seal);box-shadow:0 4px 14px rgba(14,59,46,.28);transform:translateX(-3px)}
.sClient.on::after{width:7px;opacity:1}
.sClient.on .sNm,.sClient.on .sBal,.sClient.on .sMeta{color:#fff!important}
.sClient.on .sMeta span{color:#fff!important;opacity:.9}
.sClient.on .sAv{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 2px rgba(255,255,255,.35)}
.sClient.on .sNm::after{content:' ◀';font-size:.6rem;opacity:.7}
.sAv{width:2.35rem;height:2.35rem;border-radius:50%;background:var(--cc,var(--seal));color:#fff;font-weight:900;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.15)}
.sMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.sNm{font-weight:800;font-size:1rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;word-break:break-word}
.sMeta{font-size:.67rem;font-weight:700;color:var(--ink3);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sBal{display:flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:900;font-size:.95rem;flex-shrink:0;min-width:3rem}
.sBal small{font-size:.58rem;font-weight:800;opacity:.8;letter-spacing:.02em}
.sBal.zero{color:var(--ink3);font-weight:700}
.sideHint{font-size:.64rem;font-weight:700;color:var(--ink3);padding:0 .3rem .1rem;display:flex;justify-content:space-between}
.cdot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--card);box-shadow:0 0 0 1.5px currentColor}

/* ─── شريط الدفتر (إجماليات المكتب) ─── */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.ledger>div{padding:.8rem .6rem;text-align:center;border-inline-start:1px solid var(--line)}
.ledger>div:first-child{border-inline-start:0}
.ledger .v{font-size:1.35rem;font-weight:900;line-height:1.2}
.ledger .l{font-size:.72rem;font-weight:700;color:var(--ink2)}
@media(max-width:640px){.ledger{grid-template-columns:1fr 1fr}.ledger>div:nth-child(3){border-inline-start:0;border-top:1px solid var(--line)}.ledger>div:nth-child(4){border-top:1px solid var(--line)}.ledger .v{font-size:1.15rem}}

/* ─── بطاقات العملاء ─── */
.boardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:.8rem}
.bCard{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:.85rem .95rem .8rem;text-align:right;overflow:hidden;transition:border-color .12s,transform .12s}
.bCard::before{content:'';position:absolute;inset-inline-end:0;top:0;bottom:0;width:5px;background:var(--cc,var(--seal))}
.bCard:hover{border-color:var(--line2);transform:translateY(-1.5px)}
.bCard .hd{display:flex;align-items:center;gap:.55rem;margin-bottom:.4rem}
.avat{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff;background:var(--cc,var(--seal));flex-shrink:0}
.bCard .nm{font-weight:900;font-size:1.02rem;line-height:1.25;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bCard .sb{font-size:.7rem;color:var(--ink2);font-weight:600;line-height:1.1}
.bCard .bal{font-size:1.55rem;font-weight:900;line-height:1.25}
.bCard .bal small{font-size:.72rem;font-weight:700;color:var(--ink2)}
.bCard .lbp{font-size:.78rem;font-weight:700;color:var(--ink2)}
.chipPend{display:inline-flex;align-items:center;gap:.3rem;background:var(--pendT);color:var(--pend);font-size:.72rem;font-weight:800;border-radius:999px;padding:.12rem .6rem;margin-top:.35rem}
.pos{color:var(--in)} .neg{color:var(--out)} .zero{color:var(--ink2)}

/* ─── العناوين والبطاقات العامة ─── */
.pgTitle{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 .9rem;flex-wrap:wrap}
.pgTitle h2{font-size:1.25rem;font-weight:900;color:var(--seal)}
.pgTitle .sp{flex:1}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:.9rem}
.panel h3{font-size:.95rem;font-weight:900;color:var(--seal);margin-bottom:.7rem;display:flex;align-items:center;gap:.45rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.88rem;padding:.55rem 1rem;border-radius:var(--r2);border:1.5px solid var(--line2);background:var(--card);transition:all .13s}
.btn:hover{border-color:var(--seal);color:var(--seal)}
.btnSeal{background:var(--seal);border-color:var(--seal);color:#F3EFE2}
.btnSeal:hover{background:var(--seal2);color:#fff}
.btnDanger{color:var(--out);border-color:var(--out)}
.btnGhost{border-color:transparent;color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.segRow{display:flex;background:var(--paper2);border-radius:var(--r2);padding:4px;gap:4px}
.segRow button{flex:1;font-weight:800;font-size:.92rem;padding:.55rem;border-radius:8px;color:var(--ink2)}
.segRow button.onIn{background:var(--in);color:#fff}
.segRow button.onOut{background:var(--out);color:#fff}

/* ─── سجل العمليات ─── */
.opRow{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r2);padding:.55rem .8rem;margin-bottom:.45rem}
.opRow.isPend{border-style:dashed;border-color:var(--pend);background:#FDFAF2}
.opRow.isDel{opacity:.5;text-decoration:line-through}
.tBadge{flex-shrink:0;font-weight:900;font-size:.78rem;border-radius:8px;padding:.2rem .6rem}
.tIn{background:var(--inT);color:var(--in)} .tOut{background:var(--outT);color:var(--out)}
.opRow .mid{flex:1;min-width:0}
.opRow .amt{font-size:1.12rem;font-weight:900}
.opRow .meta{font-size:.72rem;color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opRow .acts{display:flex;gap:.25rem;flex-shrink:0}
.iBtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1.5px solid var(--line);background:var(--card)}
.iBtn:hover{border-color:var(--seal)}

/* ─── بطاقات التأكيد الكبيرة ─── */
.pGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem}
.pCard{background:var(--card);border:2px solid var(--pend);border-radius:var(--r);padding:1rem;position:relative}
.pCard .amtBig{font-size:2.1rem;font-weight:900;line-height:1.15;margin:.3rem 0}
.pCard .who{font-size:.78rem;color:var(--ink2);font-weight:700}
.pCard .cName{font-weight:900;font-size:1.05rem;color:var(--seal)}
.pCard .rowBtns{display:flex;gap:.5rem;margin-top:.7rem}
.pCard .rowBtns .btn{flex:1;justify-content:center}
.lockNote{background:var(--pendT);color:var(--pend);font-size:.75rem;font-weight:800;border-radius:8px;padding:.35rem .6rem;margin-top:.6rem;text-align:center}
@keyframes sealPress{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.stamped{animation:sealPress .35s ease-out}

/* ─── جداول التقارير ─── */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:right;padding:.4rem .5rem;border-bottom:2px solid var(--line2)}
td{padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:600}
.statCell{background:var(--paper2);border-radius:var(--r2);padding:.65rem .8rem;text-align:center}
.statCell .v{font-size:1.25rem;font-weight:900;line-height:1.25}
.statCell .l{font-size:.7rem;font-weight:700;color:var(--ink2)}

/* ─── الشريط السفلي (موبايل) ─── */
.bnav{display:none;position:fixed;bottom:0;inset-inline:0;background:var(--seal);border-top:3px solid var(--brass);z-index:45;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
.bnav .in{display:flex;max-width:560px;margin:0 auto}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:#AAB8A3;font-size:.62rem;font-weight:800;padding:.25rem 0}
.bnav button span{font-size:1.25rem;line-height:1.2}
.bnav button.on{color:#fff}
.bnav button.mainAct span{background:var(--brass);color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-16px;border:3px solid var(--seal);font-size:1.5rem}
@media(max-width:900px){.bnav{display:block}.tbTabs{display:none}.tbName{font-size:1rem}}

/* ─── ورقة "المزيد" والنوافذ ─── */
.sheetBk{display:none;position:fixed;inset:0;background:rgba(20,32,26,.45);z-index:60}
.sheetBk.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:1rem 1rem 1.8rem}
.sheet button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.7rem .6rem;font-weight:800;font-size:1rem;border-radius:var(--r2);text-align:right}
.sheet button:hover{background:var(--sealT)}
.modalBk{display:none;position:fixed;inset:0;background:rgba(20,32,26,.5);z-index:70;padding:1rem;overflow-y:auto}
.modalBk.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--paper);border-radius:var(--r);width:100%;max-width:460px;padding:1.2rem;margin:auto 0}
.modal h3{font-weight:900;color:var(--seal);margin-bottom:.9rem;font-size:1.05rem}
.fRow{margin-bottom:.7rem}
.swRow{display:flex;gap:.45rem;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);transform:scale(1.12)}

/* ─── توست ─── */
#toastWrap{position:fixed;bottom:5.5rem;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:90;pointer-events:none}
.toast{background:var(--ink);color:#F3EFE2;font-weight:800;font-size:.85rem;border-radius:999px;padding:.55rem 1.2rem;max-width:92%;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);animation:sealPress .3s ease-out}
.toast.ok{background:var(--ok)} .toast.err{background:var(--out)} .toast.inf{background:var(--pend)}
.emptyBox{text-align:center;color:var(--ink2);padding:2.2rem 1rem;font-weight:700}
.emptyBox span{font-size:2rem;display:block;margin-bottom:.4rem}

/* ─── طباعة ─── */
@media print{
  body{background:#fff}
  .topbar,.bnav,.side,.noPrint,#toastWrap{display:none!important}
  .shell{padding:0}
  .panel,.opRow{border-color:#999;break-inside:avoid}
}
/* ── 🔏 بطاقة المراجعة قبل التأكيد أو الحذف — متل وصل ختم رسمي ── */
.cfCard{border:2px dashed var(--brass);border-radius:14px;background:var(--card);padding:1rem;text-align:center;margin:.6rem 0}
.cfCard .cfAmt{font-size:2.2rem;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:.4rem 0 .05rem}
.cfCard .cfNm{font-size:1.15rem;font-weight:800;margin:.25rem 0 .55rem}
.cfCard .cfRows{border-top:1px solid var(--line);margin-top:.5rem;text-align:start}
.cfCard .cfR{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;padding:.44rem .1rem;border-bottom:1px dashed var(--line);font-size:.87rem;color:var(--ink2)}
.cfCard .cfR:last-child{border-bottom:0}
.cfCard .cfR b{font-weight:800;color:var(--ink)}
.cfWarn{font-size:.8rem;color:var(--pend);font-weight:800;text-align:center;margin:.15rem 0 .75rem}
/* ── 💳 شرائح المحافظ — بطاقات صغيرة بأعلى النموذج، كبسة وحدة ── */
.wChips{display:flex;gap:.45rem;flex-wrap:wrap}
.wChip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.5rem .85rem;font-family:inherit;font-weight:800;font-size:.86rem;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.12rem;min-width:4.8rem;transition:border-color .12s,background .12s}

<div id="toastWrap"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   المختار للصيرفة — الجيل الثاني (بناء جديد كلياً)
   المحرّك: مستند مستقل لكل عملية + onSnapshot لحظي + offline persistence
   → أي عملية بتنكتب على جهاز، بتبيّن عالباقي بنفس اللحظة، بلا ملفات كبيرة
   البيانات على مجموعات mk2_* — منفصلة تماماً عن بيانات النسخة القديمة
   ═══════════════════════════════════════════════════════════════ */
'use strict';
var APP_BUILD=220;
var MIN_BUILD=201;

/* ── Firebase — نفس المشروع (نفس حسابات الدخول الرسمية)، مجموعات جديدة ── */
firebase.initializeApp({
  apiKey:'AIzaSyAaTYLQ7HE9_0MH6S9_2vq_RSVKZNJM5cA',
  authDomain:'makhtar2-920fc.firebaseapp.com',
  projectId:'makhtar2-920fc',
  storageBucket:'makhtar2-920fc.firebasestorage.app',
  messagingSenderId:'157498587013',
  appId:'1:157498587013:web:1c6f7cac3f1f70802176ec'
});
var db=firebase.firestore();
try{ db.settings({experimentalAutoDetectLongPolling:true,merge:true}); }catch(e){}
try{ db.enablePersistence({synchronizeTabs:true}).catch(function(e){console.warn('persistence:',e&&e.code);}); }catch(e){}

var C_CL=db.collection('mk2_clients'),
    C_OPS=db.collection('mk2_ops'),
    C_WL=db.collection('mk2_wallets'),
    C_TEAM=db.collection('mk2_team'),
    C_PRES=db.collection('mk2_presence'),
    C_META=db.collection('mk2_meta'),
    C_AUDIT=db.collection('mk2_audit'),
    C_CLOSE=db.collection('mk2_closings'),  // 🔒 الإقفالات — سجل لكل فترة، ما بينمحى أبداً
    C_OLD=db.collection('makhtar'); // للقراءة فقط — الاستيراد من النسخة القديمة

/* ── الحالة ── */
var CL={}, OPS={}, WL={}, TEAM={}, PRES={}, CLS={};
var _archOn=false;   // لما بيصير true: مستمع العمليات بيجيب الحيّة فقط (arch=='') — الأرشيف بينقرا عالطلب
var ME=null;               // {uid,email,name,role}
var SET={commission:0.5};  // إعدادات المكتب (تتزامن)
var DRV=null;              // المشتقات المحسوبة محلياً — الأرقام ما منوثق فيها من السلك، منشتقها (قاعدة Build 92)
var sel=localStorage.getItem('mk2_sel')||'';
var curView='board', opType='in';
var _unsubs=[], _pendWrites=0, _fromCache=false, _lastSnap=0, _staleT=null;

/* ── أدوات ── */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* 🕐 التوقيت مثبّت عبيروت مهما كان إعداد الجهاز — كل تاريخ ووقت بالبرنامج بيمرّ من هون */
var TZ='Asia/Beirut';
var _dtf=null;
function tzParts(ts){
  try{
    if(!_dtf)_dtf=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
    var o={};_dtf.formatToParts(new Date(ts)).forEach(function(p){o[p.type]=p.value;});
    if(o.hour==='24')o.hour='00';
    return o;
  }catch(e){var d=new Date(ts);return {year:String(d.getFullYear()),month:('0'+(d.getMonth()+1)).slice(-2),day:('0'+d.getDate()).slice(-2),hour:('0'+d.getHours()).slice(-2),minute:('0'+d.getMinutes()).slice(-2)};}
}
function todayStr(){var o=tzParts(Date.now());return o.year+'-'+o.month+'-'+o.day;}
function nowTime(){var o=tzParts(Date.now());return o.hour+':'+o.minute;}
function dayStart(ds){ /* بداية يوم بيروت (بالـ epoch) — بيراعي التوقيت الصيفي */
  var y=+ds.slice(0,4),m=+ds.slice(5,7),d=+ds.slice(8,10);
  var g=Date.UTC(y,m-1,d,0,0,0),p=tzParts(g);   /* عند منتصف ليل UTC، بيروت بتكون +2 أو +3 */
  var off=(+p.hour)*3600000+(+p.minute)*60000;
  if(p.day!==('0'+d).slice(-2))off-=86400000;
  return g-off;
}
function dayEnd(ds){var y=+ds.slice(0,4),m=+ds.slice(5,7),d=+ds.slice(8,10);var n=new Date(Date.UTC(y,m-1,d+1));return dayStart(n.toISOString().slice(0,10))-1;}
function dateAdd(ds,n){var y=+ds.slice(0,4),m=+ds.slice(5,7),d=+ds.slice(8,10);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);}
function fmt(n){n=+n||0;return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' $';}
function fmtN(n){n=+n||0;return n.toLocaleString('en-US');}
function balCls(n){return n>0?'pos':(n<0?'neg':'zero');}
function balTag(n){return n>0?'(لكم)':(n<0?'(لنا)':'');}
function toast(msg,cls){var w=$('toastWrap'),t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;w.appendChild(t);setTimeout(function(){t.remove();},3200);}
function isMgr(){return ME&&ME.role==='manager';}

/* أكواد العمليات — نفس خوارزمية النسخة القديمة حرفياً حتى تضل الأكواد بنفس الشكل بالكروب */
function padCode(n){
  if(n==null||isNaN(n)||n<=0)return '—';
  var BASE=26, LEN=5, SPACE=11881376;
  var x=((Math.floor(n)%SPACE)*1000003 + 7)%SPACE;
  var s='';
  for(var i=0;i<LEN;i++){ s=String.fromCharCode(65+(x%BASE))+s; x=Math.floor(x/BASE); }
  return '#'+s;
}
function maxOpCode(){var m=0;for(var k in OPS){var c=OPS[k].code||0;if(c>m)m=c;}return m;}

/* رسالة الكروب — بصيغة فاروق حرفياً (Build 108: ٣ أسطر فاضية بين الكتل) — للدخول فقط */
function waOpMsg(o){
  var t=(o.time||'');
  var ampm=''; try{var hh=parseInt(t.split(':')[0],10);if(!isNaN(hh))ampm=(hh>=12?' PM':' AM');}catch(e){}
  var amt=(o.amount%1===0)?String(o.amount):o.amount.toFixed(2);
  if(opCur(o)!=='USD')amt=(o.amount%1===0)?fmtN(o.amount):fmtW(o.amount);
  return 'لكم\n\n\n\n#'+padCode(o.code)+'\n'+t+ampm+'\n\n\n\n'+amt+(opCur(o)==='USD'?'$':' '+opCur(o));
}
function copyText(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(function(){copyFb(txt);});}
    else copyFb(txt);
  }catch(e){copyFb(txt);}
}
function copyFb(txt){try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}}
function copyOpMsg(id){
  var o=OPS[id];if(!o)return;
  if(o.type!=='in'){toast('النسخ لعمليات الدخول فقط','inf');return;}
  copyText(waOpMsg(o));toast('📋 انتسخت رسالة الكروب — الصقها بالمجموعة','ok');
}

function logAudit(act,target,detail){
  try{C_AUDIT.add({act:act,target:target||'',detail:detail||'',by:ME?ME.email:'',byName:ME?ME.name:'',at:Date.now(),b:APP_BUILD});}catch(e){}
}

/* ── الاشتقاق المحلي: كل الأرقام منحسبها من العمليات نفسها، ما منخزّن مجاميع ── */
function derive(){
  var d={clients:{},office:{ourUsd:0,theirUsd:0,ourLbp:0,theirLbp:0,cur:{}},pend:[],pendCount:0,pendSumAll:0,
         tIn:0,tInVol:0,tOut:0,tOutVol:0,
         profitMonth:0,profitToday:0,inCount:0,outCount:0,inVol:0,outVol:0,confCount:0,monthOps:0,byUser:{}};
  var tS=todayStr(), mS=tS.slice(0,7);
  for(var cid in CL){var c=CL[cid];
    var cx={};clientCur(c).forEach(function(r){cx[r.c]=+r.v||0;});   /* الأساس اليدوي لكل عملة — العمليات بتنضاف فوقو */
    d.clients[cid]={hidden:(c.active===false),bal:(c.roll&&+c.roll.usd)||0,roll:(c.roll&&+c.roll.usd)||0,lbp:+c.lbp||0,cur:cx,pend:0,pendSum:0,pendOut:0,tIn:0,tInV:0,tOut:0,tOutV:0,tProf:0,ops:0,last:0};}
  for(var k in OPS){var o=OPS[k];
    if(o.arch)continue;          /* 🗄️ المؤرشف بره الحسابات الحيّة — رصيدو صار جوّا المدوّر */
    if(o.deleted)continue;
    var cc=d.clients[o.clientId];
    var u=o.by||'؟';if(!d.byUser[u])d.byUser[u]={name:o.byName||u,add:0,conf:0};
    d.byUser[u].add++;
    if(o.confirmedBy){var cu=o.confirmedBy;if(!d.byUser[cu])d.byUser[cu]={name:o.confirmedByName||cu,add:0,conf:0};d.byUser[cu].conf++;}
    if(cc){cc.ops++;if(o.createdAt>cc.last)cc.last=o.createdAt;}
    /* 📅 نبض اليوم — كل عملية بتاريخ اليوم (المعلّقة كمان، لأنها صارت وبتنحسب) */
    var ck=opCur(o), isU=(ck==='USD');
    if(o.date===tS){   /* العدّ لكل العملات، والمجاميع بالدولار فقط */
      if(o.type==='in'){d.tIn++;if(isU)d.tInVol+=o.amount;if(cc){cc.tIn++;if(isU)cc.tInV+=o.amount;}}
      else{d.tOut++;if(isU)d.tOutVol+=o.amount;if(cc){cc.tOut++;if(isU)cc.tOutV+=o.amount;}}
    }
    /* 💱 تطبيق الحركة عرصيد عملتها */
    var applyBal=function(delta){if(!cc)return;
      if(isU)cc.bal+=delta;else if(ck==='LBP')cc.lbp+=delta;else{if(cc.cur[ck]==null)cc.cur[ck]=0;cc.cur[ck]+=delta;}};
    if(o.status==='pending'){d.pend.push(o);d.pendCount++;if(isU)d.pendSumAll+=o.amount;
      if(cc){cc.pend++;if(isU)cc.pendSum+=o.amount;
        /* 🔴 قاعدة المختار: أي خروج بينسجّل بينخصم فوراً من حساب الزبون — حتى لو لسا مش مؤكد (بأي عملة) */
        if(o.type==='out'){var pk=o.amount+(isU?(+o.commission||0):0);applyBal(-pk);if(isU)cc.pendOut+=pk;}}
      continue;}
    d.confCount++;
    if((o.date||'').slice(0,7)===mS)d.monthOps++;
    if(o.type==='in'){d.inCount++;if(isU)d.inVol+=o.amount;applyBal(o.amount);}
    else{d.outCount++;if(isU)d.outVol+=o.amount;applyBal(-(o.amount+(isU?(+o.commission||0):0)));
      var pr=isU?(+o.commission||0):0;
      if((o.date||'').slice(0,7)===mS)d.profitMonth+=pr;
      if(o.date===tS){d.profitToday+=pr;if(cc)cc.tProf+=pr;}}
  }
  for(var id in d.clients){var b=d.clients[id];if(b.hidden)continue;   /* المخفي بره مجاميع المكتب */
    if(b.bal>0)d.office.theirUsd+=b.bal;else d.office.ourUsd+=-b.bal;
    if(b.lbp>0)d.office.theirLbp+=b.lbp;else d.office.ourLbp+=-b.lbp;
    Object.keys(b.cur||{}).forEach(function(k2){var v=+b.cur[k2]||0;if(!d.office.cur[k2])d.office.cur[k2]={their:0,our:0};
      if(v>0)d.office.cur[k2].their+=v;else d.office.cur[k2].our+=-v;});}
  d.pend.sort(function(a,b){return a.createdAt-b.createdAt;});
  DRV=d;return d;
}

/* ── جوهرة المزامنة: مؤشر صادق — أخضر=لحظي، عنبري=بيحفظ/مش محدّث، رمادي=أوفلاين ── */
function setJewel(){
  var j=$('syncJewel'),t=$('syncTxt');if(!j)return;
  j.className='';
  if(!navigator.onLine){j.classList.add('off');t.textContent='أوفلاين — محفوظ محلياً';return;}
  if(_pendWrites>0){j.classList.add('busy');t.textContent='بيحفظ… ('+_pendWrites+')';return;}
  if(_fromCache&&Date.now()-_lastSnap>25000){j.classList.add('stale');t.textContent='⚠️ مش محدّث';return;}
  j.classList.add('live');t.textContent='متزامن لحظياً';
}
setInterval(setJewel,5000);
window.addEventListener('online',setJewel);
window.addEventListener('offline',setJewel);
function reviveSync(){ // 🩺 إحياء الاتصال يدوياً — فصل كل المستمعين وإعادة وصلهم
  detachAll();attachAll();toast('🔌 عم يعيد الاتصال بالسيرفر…','inf');
}
function detachAll(){_unsubs.forEach(function(u){try{u();}catch(e){}});_unsubs=[];}

/* ── المستمعون اللحظيون — قلب المحرّك الجديد ── */
function attachAll(){
  detachAll();
  /* 🗄️ بعد تفعيل الأرشفة: منسمع بس العمليات الحيّة (arch=='') — المؤرشف بينقرا عالطلب من صفحة الأرشيف */
  var qOps=_archOn?C_OPS.where('arch','==',''):C_OPS;
  _unsubs.push(qOps.onSnapshot({includeMetadataChanges:true},function(s){
    _lastSnap=Date.now();_fromCache=s.metadata.fromCache;
    var pw=0;
    s.docChanges().forEach(function(ch){
      if(ch.type==='removed'){delete OPS[ch.doc.id];}
      else{OPS[ch.doc.id]=ch.doc.data();OPS[ch.doc.id].id=ch.doc.id;}
    });
    s.forEach(function(doc){if(doc.metadata.hasPendingWrites)pw++;});
    _pendWrites=pw;setJewel();derive();renderAll();
  },function(err){console.warn('ops listener:',err);setJewel();}));
  _unsubs.push(C_CL.onSnapshot(function(s){
    s.docChanges().forEach(function(ch){
      if(ch.type==='removed')delete CL[ch.doc.id];
      else{CL[ch.doc.id]=ch.doc.data();CL[ch.doc.id].id=ch.doc.id;}
    });
    derive();renderAll();renderSide();
  }));
  _unsubs.push(C_WL.onSnapshot(function(s){
    WL={};s.forEach(function(doc){WL[doc.id]=doc.data();WL[doc.id].id=doc.id;});
    if(curView==='wallets')renderView();
  }));
  _unsubs.push(C_TEAM.onSnapshot(function(s){
    TEAM={};s.forEach(function(doc){TEAM[doc.id]=doc.data();TEAM[doc.id].uid=doc.id;});
    if(ME&&TEAM[ME.uid]){var t=TEAM[ME.uid];
      if(t.role!==ME.role||t.name!==ME.name){ME.role=t.role;ME.name=t.name;applyRole();toast('🎫 تحدّثت صلاحياتك: '+(ME.role==='manager'?'مدير':'صندوق'),'inf');}}
    if(curView==='team'||curView==='admin')renderView();
  }));
  _unsubs.push(C_PRES.onSnapshot(function(s){
    PRES={};s.forEach(function(doc){PRES[doc.id]=doc.data();});
    if(curView==='team')renderView();
  }));
  _unsubs.push(C_META.doc('app').onSnapshot(function(doc){
    var d=doc.exists?doc.data():{};
    if((d.minBuild||0)>APP_BUILD){alert('⛔ نسختك قديمة — لازم تحدّث الصفحة');location.reload();return;}
    if((d.build||0)>APP_BUILD)$('updateBanner').style.display='block';
    else if(APP_BUILD>(d.build||0))C_META.doc('app').set({build:APP_BUILD,minBuild:MIN_BUILD,at:Date.now()},{merge:true}).catch(function(){});
    if(d.commission!=null)SET.commission=+d.commission;
    /* ترحيل الأرشفة: مرة وحدة — بيضيف arch:'' للعمليات القديمة، وبعدها كل الأجهزة بتنتقل للمستمع الحيّ */
    if(d.archMig===2&&!_archOn){_archOn=true;attachAll();return;}
    if(d.archMig!==2&&ME&&ME.role==='manager')runArchMig();
  }));
  _unsubs.push(C_CLOSE.onSnapshot(function(s){
    s.docChanges().forEach(function(ch){
      if(ch.type==='removed')delete CLS[ch.doc.id];
      else{CLS[ch.doc.id]=ch.doc.data();CLS[ch.doc.id].id=ch.doc.id;}
    });
    if(curView==='reports')renderView();
  }));
}
var _migRun=false;
function runArchMig(){
  if(_migRun)return;_migRun=true;
  C_OPS.get().then(function(s){
    var need=[];s.forEach(function(doc){if(doc.data().arch===undefined)need.push(doc.ref);});
    var i=0;
    function step(){
      if(i>=need.length){C_META.doc('app').set({archMig:2},{merge:true});if(need.length)toast('🗄️ تجهّزت الأرشفة ('+need.length+' عملية)','ok');return;}
      var b=db.batch(),n=0;
      while(i<need.length&&n<400){b.update(need[i],{arch:''});i++;n++;}
      b.commit().then(step).catch(function(){_migRun=false;});
    }
    step();
  }).catch(function(){_migRun=false;});
}

function activeWallets(){return Object.values(WL).filter(function(w){return w.active!==false;}).sort(function(a,b){return (a._m||0)-(b._m||0);});}
function dupWalletJobs(){
  var groups={};
  Object.values(WL).forEach(function(w){if(w.active===false)return;var k=_nq(w.name);if(!k)return;(groups[k]=groups[k]||[]).push(w);});
  var jobs=[];
  Object.keys(groups).forEach(function(k){var g=groups[k];if(g.length<2)return;
    g.sort(function(a,b){return ((a.imported?1:0)-(b.imported?1:0))||((a._m||0)-(b._m||0));});   /* الأصلية اليدوية أولاً، وإلا الأقدم */
    g.slice(1).forEach(function(d){jobs.push({dup:d,canon:g[0]});});});
  return jobs;
}
/* 🧹 دمج المحافظ المكررة: العمليات بترجع للمحفظة الأصلية، والمكررة بتنخفى (ما بتنمحى) */
function fixDupWallets(silent){
  var jobs=dupWalletJobs();
  if(!jobs.length){if(!silent)toast('ما في محافظ مكررة ✓','ok');return Promise.resolve(0);}
  var i=0,moved=0;
  function next(){
    if(i>=jobs.length){toast('🧹 اندمجت '+jobs.length+' محفظة مكررة — '+moved+' عملية رجعت لمحلها','ok');return Promise.resolve(jobs.length);}
    var j=jobs[i++];
    return C_OPS.where('walletId','==',j.dup.id).get().then(function(sn){
      var refs=[];sn.forEach(function(d){refs.push(d.ref);});
      var p=Promise.resolve(),idx=0;
      while(idx<refs.length){(function(chunk){p=p.then(function(){var b=db.batch();
        chunk.forEach(function(r){b.update(r,{walletId:j.canon.id,walletName:j.canon.name,_m:Date.now()});});return b.commit();});})(refs.slice(idx,idx+400));idx+=400;}
      moved+=refs.length;
      return p.then(function(){return C_WL.doc(j.dup.id).set({active:false,mergedInto:j.canon.id,_m:Date.now()},{merge:true});});
    }).then(next);
  }
  return next().catch(function(){toast('ما كمل الدمج — جرّب كمان مرة','err');});
}

function _nq(x){return String(x==null?'':x).toLowerCase().replace(/#/g,'').replace(/[\u064B-\u0652]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();}
function opMatch(o,words){
  var hay=_nq([padCode(o.code),o.code,o.amount,(+o.amount).toFixed(2),o.phone,o.note,o.walletName,o.byName,o.confirmedByName,
    (CL[o.clientId]||{}).name,o.date,o.time,(o.type==='in'?'دخول':'خروج'),(o.status==='pending'?'معلق':'مؤكد'),opCur(o),(opCur(o)==='LBP'?'ليرة لبناني':'')].join(' | '));
  for(var i=0;i<words.length;i++){if(hay.indexOf(words[i])===-1)return false;}
  return true;
}
/* قائمة الكشف الحالية — نفس المنطق للعرض وللتصدير */
function stmtOps(){
  var c=CL[sel]; var q=_nq(stmtQ); var words=q?q.split(/\s+/).filter(Boolean):[];
  var allClients=words.length?(stmtScope==='all'||!c):false;
  if(!words.length&&!c)return {list:[],allClients:false,need:true};
  var list=[];
  for(var k in OPS){var o=OPS[k];if(o.arch)continue;
    if(!allClients&&o.clientId!==c.id)continue;
    if(o.deleted&&!(isMgr()&&stmtShowDel))continue;
    if(stmtFilter!=='all'&&o.type!==stmtFilter)continue;
    if(words.length&&!opMatch(o,words))continue;
    list.push(o);}
  list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  return {list:list,allClients:allClients,need:false};
}

function _ts2d(ts){var o=tzParts(ts);return o.year+'-'+o.month+'-'+o.day;}
function _ts2t(ts){var o=tzParts(ts);return o.hour+':'+o.minute;}
function _ts2dt(ts){return _ts2d(ts)+' '+_ts2t(ts);}

function openStatementPdf(){
  var c=CL[sel];if(!c){toast('اختار عميل أولاً','inf');return;}
  var from=stRange.from,to=stRange.to;

  toast('📄 عم يجهّز الكشف…','inf');
  /* كل عمليات الزبون — حتى المؤرشفة — حتى يطلع رصيد أول المدة صح ١٠٠٪ */
  C_OPS.where('clientId','==',c.id).get().then(function(sn){
    var all=[];sn.forEach(function(d){var o=d.data();o.id=d.id;all.push(o);});
    buildStatement(c,all,from,to,false);
  }).catch(function(){
    var all=[];for(var k in OPS){if(OPS[k].clientId===c.id)all.push(OPS[k]);}
    buildStatement(c,all,from,to,true);
  });
}
function buildStatement(c,all,from,to,offline){
  var fromTs=dayStart(from), toTs=dayEnd(to);   /* أيام بيروت */
  var eff=function(o){return o.type==='in'?o.amount:-(o.amount+(opCur(o)==='USD'?(+o.commission||0):0));};
  /* عملات الزبون: قائمتو + أي عملة صارت فيها عمليات */
  var curList=clientCurList(c);
  all.forEach(function(o){var k=opCur(o);if(curList.indexOf(k)===-1)curList.push(k);});
  var baseOf=function(k){ /* الأساس الأصلي = الأساس الحالي − المؤرشف (حتى ما ينعدّ مرتين مع تاريخ العمليات الكامل) */
    var base=k==='USD'?((c.roll&&+c.roll.usd)||0):(k==='LBP'?(+c.lbp||0):(function(){var r=clientCur(c).find(function(x){return x.c===k;});return r?(+r.v||0):0;})());
    all.forEach(function(o){if(o.arch&&!o.deleted&&o.status==='confirmed'&&opCur(o)===k)base-=eff(o);});
    return base;};
  var curTitle=function(k){return k==='USD'?'💵 الدولار الأمريكي':(k==='LBP'?'🇱🇧 الليرة اللبنانية':curEmoji(k)+' '+curName(k)+' ('+k+')');};
  var fmtK=function(v,k){return k==='LBP'?fmtN(Math.round(Math.abs(v))):fmtW(v);};
  var tg=function(v){return v>0?'لكم':(v<0?'لنا':'');};
  var conf=all.filter(function(o){return !o.deleted&&o.status==='confirmed';}).sort(function(a,b){return _opTs(a)-_opTs(b);});
  var totalRows=0, sections='';

    conf.forEach(function(o){if(opCur(o)!==k)return;var ts=_opTs(o);

      if(ts>toTs)return;
      if(o.type==='in'){inN++;inV+=o.amount;}else{outN++;outV+=o.amount;if(k==='USD')commV+=(+o.commission||0);}
      rows.push({o:o,ts:ts});});
    if(k!=='USD'&&!rows.length&&clientCurList(c).indexOf(k)===-1)return;   /* عملة بلا حركات ومش من عملاتو — ما منطبعها */

        +'<td class="bal '+(run>0?'p':(run<0?'n':''))+'">'+fmtK(run,k)+' '+tg(run)+'</td></tr>';}).join('');
    var closing=run;totalRows+=rows.length;
    sections+='<h2 class="cur">'+curTitle(k)+'</h2>'
      +'<div class="box"><div><span>رصيد أول المدة</span><b class="'+(opening>0?'p':(opening<0?'n':''))+'">'+fmtK(opening,k)+' '+tg(opening)+'</b></div>'

      +'<table><thead><tr><th>التاريخ</th><th>الوقت</th><th>الكود</th><th>البيان</th><th>دخول</th><th>خروج</th><th>عمولة</th><th>الرصيد بعد الحركة</th></tr></thead><tbody>'
      +(trs||'<tr><td colspan="8" style="text-align:center;color:#5a6b62">لا حركات مؤكدة بهذه العملة ضمن الفترة</td></tr>')
      +'<tr class="tot"><td colspan="4">المجموع ('+rows.length+' حركة)</td><td class="in">'+fmtK(inV,k)+'</td><td class="out">'+fmtK(outV,k)+'</td><td>'+(commV?fmtW(commV):'')+'</td><td class="bal">'+fmtK(closing,k)+' '+tg(closing)+'</td></tr>'
      +'</tbody></table>';
  });
  var pendRows=all.filter(function(o){return !o.deleted&&o.status==='pending';}).sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
  var title='مكتب المختار للصيرفة - كشف حساب - '+c.name+' - '+from+' الى '+to;
  var body='<div class="hdr"><div><h1>مكتب المختار للصيرفة</h1><div class="sub">بر الياس — البقاع • كشف حساب رسمي</div></div>'

    +'<div class="note">⏱️ الحركات مرتّبة ومؤرّخة حسب <b>يوم ووقت التأكيد</b>. الأرصدة تشمل العمليات المؤكدة فقط — وكل عملة بجدولها.'+(offline?' <b>(أُصدر أوفلاين — من البيانات المحلية)</b>':'')+'</div>'
    +sections
    +(pendRows.length?'<div class="pend"><b>⏳ عمليات مسجّلة بانتظار التأكيد — غير مشمولة بالأرصدة أعلاه:</b><ul>'+pendRows.map(function(o){return '<li>'+(o.type==='in'?'دخول':'خروج')+' '+fmtK(o.amount,opCur(o))+' '+opCur(o)+' — '+esc(padCode(o.code))+' — سُجّلت '+esc(o.date||'')+' '+esc(o.time||'')+'</li>';}).join('')+'</ul></div>':'')
    +'<div class="sig"><div>توقيع المكتب</div><div>توقيع العميل</div></div>'

function chart14(){ /* آخر ١٤ يوم — أعمدة SVG بسيطة، دخول أزرق فوق خروج أحمر */
  var days=[],max=1;
  var t0=todayStr();
  for(var i=13;i>=0;i--){days.push({d:dateAdd(t0,-i),inV:0,outV:0});}
  for(var k in OPS){var op=OPS[k];if(op.deleted||op.status!=='confirmed'||opCur(op)!=='USD')continue;
    var f=days.find(function(x){return x.d===op.date;});

  days.forEach(function(x){if(x.inV+x.outV>max)max=x.inV+x.outV;});
  var W=560,H=90,bw=W/14;
  var bars=days.map(function(x,i){
    var hi=x.inV/max*70,ho=x.outV/max*70,X=W-(i+1)*bw+3;
    return '<rect x="'+X+'" y="'+(78-hi-ho)+'" width="'+(bw-6)+'" height="'+hi+'" rx="2" fill="#1D5FA8"/>'
          +'<rect x="'+X+'" y="'+(78-ho)+'" width="'+(bw-6)+'" height="'+ho+'" rx="2" fill="#B3372F"/>'
          +'<text x="'+(X+(bw-6)/2)+'" y="88" text-anchor="middle" font-size="7" fill="#8B927F">'+x.d.slice(8)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="حركة آخر ١٤ يوم">'
    +'<line x1="0" y1="78" x2="'+W+'" y2="78" stroke="#DAD4C0"/>'+bars+'</svg>'
    +'<div style="font-size:.7rem;color:var(--ink2);font-weight:700">آخر ١٤ يوم — <span style="color:var(--in)">دخول</span> / <span style="color:var(--out)">خروج</span> (المؤكد فقط)</div>';

function estimateData(){

  var fin=function(){
    info.docs=info.live+info.arch+info.cl+info.wl+info.cls+info.team+(info.audit||0);

/* كود متسلسل: عبر transaction عالعدّاد لما في نت — أوفلاين: أعلى كود محلي +١ */
function nextCode(){
  var local=maxOpCode()+1;
  if(!navigator.onLine)return Promise.resolve(local);
  var ref=C_META.doc('counters');
  var tx=db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var n=Math.max((doc.exists&&doc.data().op)||0,local-1)+1;
      t.set(ref,{op:n},{merge:true});return n;
    });
  }).catch(function(){return local;});
  /* ⚡ عالنت الضعيف: ما مننطر أكتر من ٢٫٥ ثانية — منكمّل بالعدّاد المحلي والمزامنة بتصلّح لحالها */
  var slow=new Promise(function(res){setTimeout(function(){res(local);},2500);});
  return Promise.race([tx,slow]);
}

function doConfirmOp(id){
  var o=OPS[id];if(!o)return;
  if(o.status!=='pending'){closeModal();toast('✔️ مؤكدة أصلاً — أكّدها '+(o.confirmedByName||'حدا تاني'),'inf');return;}
  if(o._busy)return;o._busy=true;   /* 🛡️ حماية من الكبس المزدوج */
  closeModal();
  /* النسخ هون — ضمن كبسة المستخدم مباشرة لحتى يزبط عكل الموبايلات. رسالة الدخول فقط (قاعدتك) */
  var copied=false;
  if(o.type==='in'){copyText(waOpMsg(o));copied=true;}
  /* ⚡ تأكيد فوري: منحدّث محلياً بلحظتها ومنبعت للسيرفر بالخلفية — ما في انتظار عالنت الضعيف.
     قفل الملكية + حارس "مؤكدة أصلاً" فوق + مستند مستقل لكل عملية = ما في خطر تكرار */
  o.status='confirmed';o.confirmedBy=ME.email;o.confirmedByName=ME.name;o.confirmedAt=Date.now();
  derive();renderAll();
  C_OPS.doc(id).update({status:'confirmed',confirmedBy:ME.email,confirmedByName:ME.name,confirmedAt:Date.now(),_m:Date.now()})
    .then(function(){logAudit('op.confirm',(CL[o.clientId]||{}).name||'',padCode(o.code));})
    .catch(function(){toast('التأكيد محفوظ محلياً — بيوصل للسيرفر لما يرجع النت','inf');});
  toast('✅ تأكّدت'+(copied?' + 📋 انتسخت رسالة الكروب':''),'ok');
}

    '💵 الرصيد بالدولار الأمريكي',fmtW(r.agUsd)+' '+tagZ(+r.agUsd||0)];

function normPhone(p){
  p=String(p||'').replace(/\D/g,'');

  if(p.indexOf('00')===0)p=p.slice(2);
  if(p.indexOf('961')===0)return p;
  if(p.charAt(0)==='0')p=p.slice(1);
  if(p.length===7||p.length===8)return '961'+p;
  return p;
}

/* ══ 🔒 الإقفال والأرشيف — قواعد المكتب: ما في محو، رصيد مدوّر، تراجع كامل ══ */
function openClosing(){
  if(!isMgr()){toast('الإقفال عند المدير','inf');return;}
  var pendN=0,liveN=0;
  for(var k in OPS){var o=OPS[k];if(o.arch)continue;liveN++;
    if(!o.deleted&&o.status==='pending')pendN++;}
  if(pendN>0){toast('⏳ في '+pendN+' عمليات معلّقة — أكّدها أو احذفها قبل الإقفال','err');return;}
  if(!liveN){toast('ما في عمليات حيّة لتتأرشف','inf');return;}
  var t=todayStr();
  openModal('<h3>🔒 إقفال الفترة</h3>'
    +'<div class="cfCard"><div class="cfRows">'
    +'<div class="cfR"><span>عمليات رح تتأرشف</span><b class="num">'+liveN+'</b></div>'
    +'<div class="cfR"><span>ربح الفترة (عمولات مؤكدة)</span><b class="num" style="color:var(--ok)">'+fmt(_livePeriodProfit())+'</b></div>'
    +'<div class="cfR"><span>بعد الإقفال</span><b>كل زبون بيكمّل برصيد مدوّر = رصيدو الحالي</b></div></div></div>'
    +'<div class="fRow"><label>اسم الفترة</label><input id="clPeriod" value="'+t.slice(0,7)+'" placeholder="2026-09"></div>'
    +'<div class="cfWarn">ما في شي بينمحى — كل العمليات بتضل مقروءة بالأرشيف، وفي تراجع كامل عن آخر إقفال</div>'
    +'<div style="display:flex;gap:.5rem">'
    +'<button class="btn" style="flex:1;justify-content:center" onclick="closeModal()">رجوع</button>'
    +'<button class="btn btnSeal" style="flex:2;justify-content:center" onclick="doClosing()">🔒 أقفل وأرشف</button></div>');
}
function _livePeriodProfit(){var p=0;for(var k in OPS){var o=OPS[k];if(!o.arch&&!o.deleted&&o.status==='confirmed'&&o.type==='out')p+=(+o.commission||0);}return p;}
function doClosing(){
  var period=($('clPeriod').value||'').trim()||todayStr().slice(0,7);
  closeModal();
  var snap={},totIn=0,totOut=0,profit=0,opCount=0;
  for(var k in OPS){var o=OPS[k];if(o.arch)continue;opCount++;
    if(!o.deleted&&o.status==='confirmed'&&opCur(o)==='USD'){if(o.type==='in')totIn+=o.amount;else{totOut+=o.amount;profit+=(+o.commission||0);}}}
  derive();   /* صورة طازة — كل الزبائن (حتى المخفيين) بكل عملاتهن */
  for(var cid in CL){var c=CL[cid];
    var b=DRV.clients[cid]||{bal:0,lbp:+c.lbp||0,cur:{}};
    var curD={};Object.keys(b.cur||{}).forEach(function(k2){curD[k2]=Math.round((+b.cur[k2]||0)*100)/100;});
    snap[cid]={name:c.name||'',usd:Math.round(b.bal*100)/100,lbp:Math.round(b.lbp||0),cur:curD,
      prevRollUsd:(c.roll&&+c.roll.usd)||0,prevLbp:+c.lbp||0,prevCur:clientCur(c).map(function(r){return {c:r.c,v:+r.v||0};})};}
  var id=uid();
  var doc={period:period,at:Date.now(),by:ME.email,byName:ME.name,phase:'pending',undone:false,
           opCount:opCount,totIn:totIn,totOut:totOut,profit:profit,clients:snap};
  C_CLOSE.doc(id).set(doc).then(function(){doc.id=id;applyClosing(doc);})
    .catch(function(e){toast('ما قدر يبلّش الإقفال — '+((e&&e.message)||''),'err');});
}
function resumeClosing(id){var x=CLS[id];if(!x)return;applyClosing(x);}
function applyClosing(cl){
  /* مرحلتين: (١) تثبيت الرصيد المدوّر لكل زبون من صورة الإقفال — (٢) أرشفة العمليات. آمنة للإعادة لو انقطع النت */
  toast('🔒 عم يقفل… لا تسكّر الصفحة','inf');
  var cids=Object.keys(cl.clients||{});
  var i=0;
  function rollStep(){
    if(i>=cids.length)return archStep();
    var b=db.batch(),n=0;
    while(i<cids.length&&n<300){var cid=cids[i];
      var sc=cl.clients[cid];var upd={roll:{usd:sc.usd},_m:Date.now()};
      if(sc.cur!==undefined){upd.lbp=sc.lbp||0;upd.cur=Object.keys(sc.cur||{}).map(function(k2){return {c:k2,v:+sc.cur[k2]||0};});}   /* إقفالات ما قبل العملات ما بتلمس الأساس */
      b.update(C_CL.doc(cid),upd);i++;n++;}
    b.commit().then(rollStep).catch(function(e){toast('انقطع الإقفال — كبس متابعة من التقارير','err');});
  }
  function archStep(){
    C_OPS.where('arch','==','').get().then(function(s){
      var refs=[];s.forEach(function(d){var o=d.data();if((o.createdAt||0)<=cl.at)refs.push(d.ref);});
      var j=0;
      function step(){
        if(j>=refs.length){
          C_CLOSE.doc(cl.id).update({phase:'done',_m:Date.now()}).then(function(){
            logAudit('closing',cl.period,refs.length+' عملية');
            toast('🔒 انقفلت فترة '+cl.period+' — كل شي بالأرشيف ومقروء','ok');});
          return;}
        var b=db.batch(),n=0;
        while(j<refs.length&&n<400){b.update(refs[j],{arch:cl.id,_m:Date.now()});j++;n++;}
        b.commit().then(step).catch(function(){toast('انقطع الإقفال — كبس متابعة من التقارير','err');});
      }
      step();
    }).catch(function(){toast('انقطع الإقفال — كبس متابعة من التقارير','err');});
  }
  rollStep();
}

  var rows=Object.keys(x.clients||{}).map(function(cid){var c=x.clients[cid];

  }).join('');
  openModal('<h3>🗄️ إقفال '+esc(x.period||'')+(x.undone?' <small style="color:var(--pend)">— متراجَع عنه</small>':'')+'</h3>'
    +'<div class="cfCard"><div class="cfRows">'

    +'<div style="font-size:.78rem;font-weight:800;color:var(--ink3);margin:.4rem .1rem">أرصدة الإقفال (صارت الرصيد المدوّر):</div>'
    +'<div class="cfCard" style="max-height:14rem;overflow:auto"><div class="cfRows">'+rows+'</div></div>'
    +'<div style="display:flex;gap:.5rem;flex-wrap:wrap">'
    +'<button class="btn" style="flex:1;justify-content:center" onclick="closeModal()">إغلاق</button>'
    +'<button class="btn btnSeal" style="flex:1;justify-content:center" onclick="expClosing(\''+id+'\')">📗 Excel</button>'
    +(canUndo?'<button class="btn btnDanger" style="flex:1;justify-content:center" onclick="undoClosing(\''+id+'\')">↩️ تراجع كامل</button>':'')
    +'</div>');
}
function undoClosing(id){
  var x=CLS[id];if(!x||!isMgr())return;
  closeModal();
  toast('↩️ عم يرجّع… لا تسكّر الصفحة','inf');
  C_OPS.where('arch','==',id).get().then(function(s){
    var refs=[];s.forEach(function(d){refs.push(d.ref);});
    var j=0;
    function step(){
      if(j>=refs.length){
        var cids=Object.keys(x.clients||{}),i=0;
        function rb(){
          if(i>=cids.length){
            C_CLOSE.doc(id).update({undone:true,undoneBy:ME.email,undoneByName:ME.name,undoneAt:Date.now(),_m:Date.now()})
              .then(function(){logAudit('closing.undo',x.period,refs.length+' عملية رجعت');
                toast('↩️ رجع كل شي متل ما كان — الإقفال باقي بالسجل معلّم متراجَع عنه','ok');});
            return;}
          var b=db.batch(),n=0;
          while(i<cids.length&&n<300){var cid=cids[i];
            var pc=x.clients[cid];var upd={roll:{usd:pc.prevRollUsd||0},_m:Date.now()};
            if(pc.prevCur!==undefined){upd.lbp=pc.prevLbp||0;upd.cur=pc.prevCur||[];}
            b.update(C_CL.doc(cid),upd);i++;n++;}
          b.commit().then(rb).catch(function(){toast('انقطع التراجع — عيد الكبسة','err');});
        }
        rb();return;}
      var b=db.batch(),n=0;
      while(j<refs.length&&n<400){b.update(refs[j],{arch:''});j++;n++;}
      b.commit().then(step).catch(function(){toast('انقطع التراجع — عيد الكبسة','err');});
    }
    step();
  }).catch(function(){toast('ما قدر يقرا عمليات الإقفال','err');});
}
/* ── 📗 تصدير Excel (CSV بترميز عربي بيفتح عالإكسل مباشرة) ── */
function dlFile(name,txt){
  var b=new Blob(['\uFEFF'+txt],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
}
function _csvCell(v){v=(v==null?'':String(v));return '"'+v.replace(/"/g,'""')+'"';}
function _opsCsv(list,nameOf){
  var head=['التاريخ','الوقت','الكود','العميل','النوع','المبلغ','العملة','العمولة','المحفظة','الحالة','سجّلها','أكّدها','ملاحظة'];
  var rows=list.map(function(o){
    return [o.date||'',o.time||'',padCode(o.code),nameOf(o.clientId),(o.type==='in'?'دخول':'خروج'),
      o.amount,opCur(o),(+o.commission||0),o.walletName||'',(o.deleted?'محذوفة':(o.status==='confirmed'?'مؤكدة':'معلّقة')),
      o.byName||o.by||'',o.confirmedByName||'',o.note||''].map(_csvCell).join(',');
  });
  return head.map(_csvCell).join(',')+'\r\n'+rows.join('\r\n');
}
function expClosing(id){
  var x=CLS[id];if(!x)return;
  toast('📗 عم يجهّز الملف…','inf');
  C_OPS.where('arch','==',id).get().then(function(s){
    var list=[];s.forEach(function(d){list.push(d.data());});
    list.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});
    var nameOf=function(cid){return (x.clients&&x.clients[cid]&&x.clients[cid].name)||(CL[cid]&&CL[cid].name)||'؟';};
    var csv=_opsCsv(list,nameOf);
    csv+='\r\n\r\n'+_csvCell('أرصدة الإقفال '+(x.period||''))+'\r\n'
      +[_csvCell('العميل'),_csvCell('الرصيد $'),_csvCell('الرصيد ل.ل'),_csvCell('عملات أخرى')].join(',')+'\r\n'
      +Object.keys(x.clients||{}).map(function(cid){var c=x.clients[cid];
          var ex=Object.keys(c.cur||{}).map(function(k2){return k2+' '+(+c.cur[k2]||0);}).join('; ');
          return [_csvCell(c.name),_csvCell(c.usd),_csvCell(c.lbp),_csvCell(ex)].join(',');}).join('\r\n');
    dlFile('makhtar-'+(x.period||'closing')+'.csv',csv);
  }).catch(function(){toast('ما قدر يجهّز الملف','err');});
}

/* ── 📦 الاستيراد من النسخة القديمة — قراءة فقط، آمن الإعادة، بيحترم شواهد الحذف ── */
function lzUnpack(str){
  if(typeof str!=='string')return str;
  if(str.indexOf('LZ1:')===0){try{return (typeof LZString!=='undefined'&&LZString.decompressFromUTF16)?(LZString.decompressFromUTF16(str.slice(4))||''):'';}catch(e){return '';}}
  return str;
}
function importOld(){
  if(!isMgr())return;
  var btn=$('impBtn'),log=$('impLog');
  btn.disabled=true;btn.textContent='عم يقرأ القديم…';
  log.textContent='';
  var nCl=0,nOps=0,nWl=0,skipped=0,exCl=0,exOps=0;
  var existing={};   /* كل العمليات الموجودة بالجديدة — حيّة ومؤرشفة — ما منلمسها أبداً */
  C_OPS.get().then(function(all){all.forEach(function(d){existing[d.id]=1;});return C_OLD.get();}).then(function(snap){
    var batch=db.batch(),inBatch=0,batches=[];
    function commit(){if(inBatch){batches.push(batch.commit());batch=db.batch();inBatch=0;}}
    function bset(ref,data){batch.set(ref,data,{merge:true});if(++inBatch>=400)commit();}
    snap.forEach(function(doc){
      var id=doc.id,d=doc.data();
      if(id.indexOf('cl_')===0){
        var raw=lzUnpack(d.j);if(!raw)return;
        var c;try{c=JSON.parse(raw);}catch(e){return;}
        if(!c||!c.name)return;
        var cid=c.id||id.slice(3);
        if(CL[cid]){exCl++;}   /* الزبون موجود بالجديدة — بنضل عتعديلاتك (ألوان، عملات، رقم…) */
        else{nCl++;bset(C_CL.doc(cid),{name:c.name,sub:c.sub||'',color:c.color||CPAL[nCl%CPAL.length],lbp:0,active:true,createdAt:c.metaAt||Date.now(),importedAt:Date.now(),_m:Date.now()});}
        var delSet={};(c.delOps||[]).forEach(function(t){delSet[t.id]=1;});
        (c.ops||[]).forEach(function(o){
          if(!o||!o.id)return;
          if(delSet[o.id]){skipped++;return;}
          if(existing[o.id]){exOps++;return;}   /* موجودة أصلاً (أو مؤرشفة) — ما منعيد كتابتها */
          nOps++;
          bset(C_OPS.doc(o.id),{clientId:cid,code:o.code||0,type:o.type==='in'?'in':'out',
            amount:+o.amount||0,date:o.date||'',time:o.time||'',phone:o.phone||'',note:o.note||'',
            status:o.status==='confirmed'?'confirmed':'pending',
            arch:'',
            walletId:o.walletId||'',walletName:o.walletName||'',commission:+o.commission||0,
            by:o.by||'',byName:o.by||'',confirmedBy:o.confirmedBy||'',confirmedByName:o.confirmedBy||'',
            confirmedAt:o.confirmedAt||0,createdAt:o.createdAt||Date.now(),updatedAt:o.updatedAt||Date.now(),
            imported:true,_m:Date.now()});
        });
      }else if(id.indexOf('wl_')===0){
        var rw=lzUnpack(d.j);if(!rw)return;
        var w;try{w=JSON.parse(rw);}catch(e){return;}
        if(!w||!w.name)return;nWl++;
        var wid=w.id||id.slice(3);
        var dupOf=Object.values(WL).find(function(x){return x.id!==wid&&x.active!==false&&_nq(x.name)===_nq(w.name);});
        if(dupOf)bset(C_WL.doc(wid),{name:w.name,desc:w.desc||'',imported:true,active:false,mergedInto:dupOf.id,_m:Date.now()});   /* موجودة بنفس الاسم — بتنخفى وبتندمج */
        else bset(C_WL.doc(wid),{name:w.name,desc:w.desc||'',imported:true,_m:Date.now()});
      }
    });
    commit();
    return Promise.all(batches);
  }).then(function(){
    /* ثبّت عدّاد الأكواد فوق أعلى كود مستورد حتى ما يتكرر كود */
    var mx=maxOpCode();
    return C_META.doc('counters').set({op:firebase.firestore.FieldValue.increment(0)},{merge:true}).then(function(){
      return db.runTransaction(function(t){var ref=C_META.doc('counters');
        return t.get(ref).then(function(doc){var cur=(doc.exists&&doc.data().op)||0;if(mx>cur)t.set(ref,{op:mx},{merge:true});});});
    }).then(function(){
      btn.disabled=false;btn.textContent='📦 ابدأ الاستيراد';
      log.textContent='✅ خلص الاستيراد:\n'+nCl+' عميل جديد • '+nOps+' عملية جديدة • '+nWl+' محفظة'+((exCl||exOps)?'\n('+exCl+' عميل و'+exOps+' عملية كانوا موجودين — ما انلمسوا)':'')+(skipped?'\n('+skipped+' محذوفة قديمة ما انسحبت — الشواهد محترمة)':'');
      logAudit('import.old','',nCl+'cl/'+nOps+'ops');
      toast('📦 خلص الاستيراد بنجاح','ok');
      setTimeout(function(){fixDupWallets(true);},1500);   /* 🧹 دمج تلقائي لأي محفظة مكررة */
    });
  }).catch(function(e){
    btn.disabled=false;btn.textContent='📦 ابدأ الاستيراد';
    log.textContent='❌ وقف الاستيراد: '+(e&&e.message||e)+'\nفيك تعيدو بأمان — ما بيكرر شي.';
  });
}

/* ── Service Worker ── */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
